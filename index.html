<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CRM VIPO</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--pet:#1F4E5A;--sal:#8FAE9B;--bg:#F5F3EE;--card:#fff;--txt:#1E2021;--mut:#6B7276;--q:#D9534F;--m:#E8A33D;--f:#7A9CC6;--line:#E4E1DA}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Nunito Sans',system-ui,sans-serif;background:var(--bg);color:var(--txt);-webkit-tap-highlight-color:transparent}
header{background:var(--pet);color:#fff;padding:16px 16px 12px;position:sticky;top:0;z-index:5}
header h1{font-size:20px;font-weight:800;letter-spacing:.3px}
header h1 span{color:var(--sal);font-weight:600}
.kpis{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.kpi{background:rgba(255,255,255,.12);border-radius:10px;padding:6px 10px;min-width:74px}
.kpi b{display:block;font-size:18px}.kpi small{font-size:11px;opacity:.85}
.bar{display:flex;gap:8px;padding:10px 12px;background:var(--bg);position:sticky;top:112px;z-index:4;flex-wrap:wrap}
.bar input,.bar select{flex:1;min-width:120px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:15px;background:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:0 12px 8px}
.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--mut)}
.tab.on{background:var(--pet);color:#fff;border-color:var(--pet)}
.tab i{font-style:normal;opacity:.7;margin-left:4px}
.board{display:flex;gap:12px;overflow-x:auto;padding:4px 12px 90px;scroll-snap-type:x mandatory}
.col{flex:0 0 86vw;max-width:340px;scroll-snap-align:start}
@media(min-width:900px){.col{flex:0 0 300px}}
.col h2{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--mut);margin:6px 2px 8px;display:flex;justify-content:space-between}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06);border-left:5px solid var(--f);cursor:pointer}
.card.quente{border-left-color:var(--q)}.card.morno{border-left-color:var(--m)}
.card .n{font-weight:800;font-size:15px}.card .s{font-size:12.5px;color:var(--mut);margin-top:3px}
.card .p{font-size:12.5px;margin-top:6px;color:var(--pet);font-weight:700}
.card .late{color:var(--q)}
.chip{display:inline-block;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px;margin-right:4px;background:#EEF3F0;color:var(--pet)}
.chip.sem{background:#FDECEC;color:#A33}
dialog{border:none;border-radius:18px;padding:0;width:min(560px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.4)}
.dh{background:var(--pet);color:#fff;padding:14px 16px;font-weight:800;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.dh button{background:none;border:none;color:#fff;font-size:24px}
.db{padding:14px 16px;display:grid;gap:10px}
label{font-size:12px;font-weight:700;color:var(--mut);display:grid;gap:4px}
label input,label select,label textarea{border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;color:var(--txt);background:#fff}
textarea{min-height:70px;resize:vertical}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 16px}
.b{border:none;border-radius:12px;padding:12px 14px;font:inherit;font-weight:800;font-size:15px;flex:1}
.b.wa{background:#25D366;color:#fff}.b.ok{background:var(--pet);color:#fff}.b.del{background:#F3E1E1;color:#A33;flex:0}
.hist{font-size:12.5px;color:var(--mut);border-top:1px dashed var(--line);padding-top:8px;white-space:pre-wrap}
.fab{position:fixed;right:16px;bottom:18px;background:var(--pet);color:#fff;border:none;border-radius:999px;padding:14px 18px;font:inherit;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.25);z-index:6}
.menu{position:fixed;left:12px;bottom:18px;display:flex;gap:8px;z-index:6}
.menu button{background:#fff;border:1px solid var(--line);border-radius:999px;padding:12px 14px;font:inherit;font-weight:700;font-size:13px}
.empty{color:var(--mut);font-size:13px;padding:8px 2px}
</style></head><body><div id="lock" style="position:fixed;inset:0;background:#1F4E5A;z-index:99;display:flex;align-items:center;justify-content:center"><form id="lf" style="background:#fff;border-radius:18px;padding:22px;width:min(340px,90vw);display:grid;gap:12px;font-family:inherit"><b style="font-size:20px;color:#1F4E5A">CRM VIPO</b><span style="font-size:13px;color:#6B7276">Digite a senha para abrir.</span><input id="lp" type="password" autocomplete="current-password" style="border:1px solid #E4E1DA;border-radius:10px;padding:12px;font-size:16px"><button style="background:#1F4E5A;color:#fff;border:none;border-radius:12px;padding:12px;font-weight:800;font-size:15px">Entrar</button><span id="le" style="color:#A33;font-size:13px"></span></form></div>
<header><h1>CRM <span>VIPO</span></h1><div class="kpis" id="kpis"></div></header>
<div class="bar"><input id="q" placeholder="Buscar nome, DDD, observação…"><select id="ft"><option value="">Todas as temperaturas</option><option>quente</option><option>morno</option><option>frio</option></select></div>
<div class="tabs" id="tabs"></div>
<div class="board" id="board"></div>
<dialog id="fila"><div class="dh"><span id="fq_t">Envio do dia</span><button onclick="fila.close();render()">×</button></div>
<div class="db"><div id="fq_info" style="font-size:13px;color:var(--mut)"></div>
<div id="fq_nome" style="font-weight:800;font-size:18px"></div>
<textarea id="fq_txt" style="min-height:220px"></textarea></div>
<div class="btns"><button class="b wa" onclick="filaEnviar()">Enviar no WhatsApp</button><button class="b" style="background:#EEF3F0;color:var(--pet)" onclick="filaProx(true)">Pular</button></div>
</dialog>
<div class="menu"><button onclick="filaAbrir()" style="background:#25D366;color:#fff;border-color:#25D366">▶ Envio do dia</button><button onclick="hoje()">📅 Hoje</button><button onclick="exportar()">⬇️ Planilha</button></div>
<button class="fab" onclick="abrir()">+ Dentista</button>
<dialog id="dlg"><div class="dh"><span id="dt">Dentista</span><button onclick="dlg.close()">×</button></div>
<div class="db">
<label>Nome<input id="f_nome"></label>
<div class="row"><label>WhatsApp (com DDD)<input id="f_tel" inputmode="tel" placeholder="22999999999"></label>
<label>Temperatura<select id="f_temp"><option>quente</option><option>morno</option><option>frio</option></select></label></div>
<div class="row"><label>Etapa<select id="f_etapa"></select></label>
<label>Já comprou?<select id="f_comprou"><option value="">Não</option><option>App VIPO</option><option>Horas</option><option>Imersão online</option><option>Imersão presencial</option><option>Mentoria</option></select></label></div>
<label>Interesse<select id="f_int"><option value="">—</option><option>App VIPO Fundamentos</option><option>Horas individuais</option><option>Mentoria</option><option>Imersão presencial (março)</option></select></label>
<label>O que a pessoa disse / observação<textarea id="f_obs"></textarea></label>
<div class="row"><label>Próximo passo<input id="f_prox" placeholder="Ex.: mandar link do app"></label>
<label>Quando<input id="f_data" type="date"></label></div>
<div class="hist" id="f_hist"></div>
<div style="border-top:1px solid var(--line);padding-top:10px;display:grid;gap:8px">
<label>Mensagem do fluxo<select id="f_msg" onchange="montarMsg()"></select></label>
<textarea id="f_txt" style="min-height:150px"></textarea>
<div style="display:flex;gap:8px"><button type="button" class="b wa" onclick="enviarMsg()">Enviar no WhatsApp</button><button type="button" class="b" style="background:#EEF3F0;color:var(--pet)" onclick="copiarMsg()">Copiar</button></div>
</div>
</div>
<div class="btns"><button class="b wa" id="bwa">WhatsApp</button><button class="b ok" onclick="salvar()">Salvar</button><button class="b del" onclick="excluir()">🗑</button></div>
</dialog>
<script>
const ETAPAS=[["novo","Novo"],["abordado","Abordado"],["respondeu","Respondeu"],["interessado","Interessado"],["proposta","Proposta enviada"],["convertido","Comprou ✅"],["perdido","Perdido / não agora"]];

const KEY="crm-vipo-v1";
let L=[];let cur=null,lista="";
const $=id=>document.getElementById(id);
const save=()=>localStorage.setItem(KEY,JSON.stringify(L));
const hojeISO=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const br=d=>d?d.split("-").reverse().slice(0,2).join("/"):"";
$("f_etapa").innerHTML=ETAPAS.map(e=>`<option value="${e[0]}">${e[1]}</option>`).join("");
function filtrados(){const q=$("q").value.toLowerCase(),t=$("ft").value;
 return L.filter(x=>(!t||x.temp===t)&&(!lista||x.lista.includes(lista))&&(!q||(x.nome+" "+x.ddd+" "+x.obs+" "+x.lista+" "+x.tel).toLowerCase().includes(q)))}
function render(){const F=filtrados(),h=hojeISO();
 const listas=["",...new Set(L.flatMap(x=>x.lista.split(", ")))];
 $("tabs").innerHTML=listas.map(l=>`<button class="tab ${l===lista?'on':''}" onclick="lista='${l}';render()">${l||'Todas'}<i>${l?L.filter(x=>x.lista.includes(l)).length:L.length}</i></button>`).join("");
 const k=[["Total",L.length],["Quentes",L.filter(x=>x.temp==="quente").length],["Pra hoje",L.filter(x=>x.data&&x.data<=h&&!["convertido","perdido"].includes(x.etapa)).length],["Conversas",L.filter(x=>!["novo"].includes(x.etapa)).length],["Vendas",L.filter(x=>x.etapa==="convertido").length]];
 $("kpis").innerHTML=k.map(a=>`<div class="kpi"><b>${a[1]}</b><small>${a[0]}</small></div>`).join("");
 $("board").innerHTML=ETAPAS.map(([id,nm])=>{const C=F.filter(x=>x.etapa===id).sort((a,b)=>({quente:0,morno:1,frio:2}[a.temp]-{quente:0,morno:1,frio:2}[b.temp])||(a.data||"9").localeCompare(b.data||"9"));
  return `<section class="col"><h2>${nm}<span>${C.length}</span></h2>${C.map(x=>`<div class="card ${x.temp}" onclick="abrir(${x.id})"><div class="n">${x.nome||"Sem nome · "+(x.tel?"+"+x.tel:"")}</div><div class="s">${x.ddd?"DDD "+x.ddd+" · ":""}${x.lista}</div><div style="margin-top:6px">${x.comprou?`<span class="chip">${x.comprou}</span>`:""}${x.int?`<span class="chip">${x.int}</span>`:""}${x.tel?"":`<span class="chip sem">sem número</span>`}</div>${x.prox||x.data?`<div class="p ${x.data&&x.data<=h?'late':''}">→ ${x.prox||"retomar"} ${br(x.data)}</div>`:""}</div>`).join("")||'<div class="empty">Ninguém aqui.</div>'}</section>`}).join("")}
function abrir(id){cur=id?L.find(x=>x.id===id):{id:Math.max(0,...L.map(x=>x.id))+1,nome:"",tel:"",ddd:"",lista:"Novo",temp:"morno",etapa:"novo",comprou:"",int:"",obs:"",prox:"",data:"",hist:""};
 $("dt").textContent=cur.nome||"Dentista";["nome","tel","temp","etapa","comprou","int","obs","prox","data"].forEach(f=>$("f_"+f).value=cur[f]||"");
 $("f_hist").textContent=cur.hist||"";$("f_msg").value=sugerida(cur);montarMsg();$("bwa").onclick=()=>{const t=$("f_tel").value.replace(/\D/g,"");if(!t)return alert("Sem número salvo.");const n=t.length<=11?"55"+t:t;window.open("https://wa.me/"+n,"_blank")};$("dlg").showModal()}
const MSGS=[
["p1","1 · Reconexão (para todos)","novo","Oi, {n}! Aqui é a Ludmila Azevedo, do Método VIPO 😊 Faz tempo que a gente não conversa, né?\n\nEstou organizando as próximas turmas e queria te ouvir antes de te mandar qualquer coisa. Hoje, nos seus casos de DTM e dor orofacial, o que mais te desafia?\n\n1 – Fechar o diagnóstico na primeira consulta\n2 – Explicar para o paciente e ele seguir com o tratamento\n3 – Os ajustes e o retrabalho depois que o tratamento começou\n\nPode responder só com o número. E se isso não fizer mais sentido para você, é só me dizer que eu não te mando mais 💛"],
["p2a","2 · Respondeu 1 (diagnóstico)","respondeu","Faz todo sentido, {n}. A primeira consulta é onde a maioria dos casos complexos se perde, porque a gente acaba olhando só para os dentes, e a dor muitas vezes vem da postura, da musculatura, do sono, do estresse.\n\nÉ exatamente isso que eu trabalho no VIPO: um raciocínio para enxergar o paciente inteiro e fechar o diagnóstico com mais segurança.\n\nHoje tenho dois caminhos. Qual combina mais com você agora?\n\nA – Começar online, no seu ritmo: aula gravada + app VIPO\nB – Aprender na prática: imersão presencial em São Paulo, em março"],
["p2b","2 · Respondeu 2 (paciente seguir)","respondeu","Isso é muito comum, {n}. Quando o paciente não entende o porquê do tratamento, ele não enxerga valor e acaba não seguindo.\n\nNo VIPO eu ensino a organizar o raciocínio do caso de um jeito que o próprio paciente entende, e isso muda a conversa do orçamento.\n\nHoje tenho dois caminhos. Qual combina mais com você agora?\n\nA – Começar online, no seu ritmo: aula gravada + app VIPO\nB – Aprender na prática: imersão presencial em São Paulo, em março"],
["p2c","2 · Respondeu 3 (retrabalho)","respondeu","Te entendo, {n}. O retrabalho quase sempre vem de uma avaliação inicial que não olhou o paciente inteiro, e aí os ajustes não acabam.\n\nNo VIPO eu ensino a avaliar de forma sistêmica desde o começo, para o tratamento ter menos surpresa no meio do caminho.\n\nHoje tenho dois caminhos. Qual combina mais com você agora?\n\nA – Começar online, no seu ritmo: aula gravada + app VIPO\nB – Aprender na prática: imersão presencial em São Paulo, em março"],
["p3a","3A · Escolheu online (Fundamentos)","proposta","Perfeito, {n}! O VIPO Fundamentos é a aula gravada + o app VIPO, para você aplicar o raciocínio sistêmico já na próxima primeira consulta.\n\nAté 30/11 ele está por R$197 (depois volta para R$297). O link é este:\nhttps://pay.cakto.com.br/6vuhrxk\n\nQualquer dúvida, me chama aqui."],
["p3b","3B · Escolheu presencial (6 vagas)","proposta","Que bom, {n}! A imersão presencial vai ser em São Paulo, em março, para uma turma de 20 dentistas, no mesmo formato da turma de setembro: um dia inteiro de prática, com o raciocínio do VIPO aplicado aos casos.\n\nAs 6 primeiras vagas saem por R$1.497 em 6x de R$249,50, já com o app VIPO incluído. Essa condição vale até 30/11.\n\nA data exata eu confirmo em breve. Quer que eu reserve uma dessas 6 vagas para você?"],
["p4","4 · Lembrete (não respondeu, 3 dias depois)","abordado","Oi, {n}! Sei que a rotina está corrida. Se puder, me responde só com 1, 2 ou 3: isso me ajuda muito a montar a próxima turma 😊"],
["p5","5 · Última chamada (28 ou 29/11)","proposta","Oi, {n}! Passando só para avisar que a condição que te mandei vale até 30/11. Quer que eu te mande o link de novo?"]];
const PROXETAPA={p1:"abordado",p2a:"interessado",p2b:"interessado",p2c:"interessado",p3a:"proposta",p3b:"proposta",p4:"abordado",p5:"proposta"};
$("f_msg").innerHTML=MSGS.map(m=>`<option value="${m[0]}">${m[1]}</option>`).join("");
function primeiroNome(n){n=(n||"").replace(/[^\p{L}\s_.\-]/gu," ").replace(/^\s*(dra?|dr|prof)\.?\s+/i,"").trim();const p=n.split(/[\s_\-]+/)[0]||"";return p?p[0].toUpperCase()+p.slice(1).toLowerCase():"tudo bem"}
function sugerida(x){return {novo:"p1",abordado:"p4",respondeu:"p2a",interessado:"p3a",proposta:"p5"}[x.etapa]||"p1"}
function montarMsg(){const m=MSGS.find(m=>m[0]===$("f_msg").value);$("f_txt").value=m[3].replaceAll("{n}",primeiroNome($("f_nome").value))}
function enviarMsg(){const t=$("f_tel").value.replace(/\D/g,"");const txt=$("f_txt").value;
 const k=$("f_msg").value;cur.hist=(cur.hist||"")+`${br(hojeISO())}: mensagem ${k.toUpperCase()}\n`;
 const ne=PROXETAPA[k];if(ne&&ETAPAS.findIndex(e=>e[0]===ne)>ETAPAS.findIndex(e=>e[0]===$("f_etapa").value))$("f_etapa").value=ne;
 if(["p1","p4"].includes(k)){const d=new Date(Date.now()+3*864e5);$("f_data").value=d.toISOString().slice(0,10);$("f_prox").value=k==="p1"?"Lembrete se não responder":"Parar se não responder"}
 if(!t){copiarMsg();alert("Sem número salvo: texto copiado. Abra a conversa no WhatsApp e cole.");salvar();return}
 const n=t.length<=11?"55"+t:t;window.open("https://wa.me/"+n+"?text="+encodeURIComponent(txt),"_blank");salvar()}
const LOTE=25;let FQ=[],fi=0;
function filaMontar(){const h=hojeISO(),ord={quente:0,morno:1,frio:2};
 const ok=x=>!/aluna/i.test(x.obs||"")&&!/não contactar|nao contactar/i.test(x.obs||"")&&x.etapa!=="convertido"&&x.etapa!=="perdido";
 const lemb=L.filter(x=>ok(x)&&x.etapa==="abordado"&&x.data&&x.data<=h&&!/mensagem P4/.test(x.hist||"")).map(x=>[x,"p4"]);
 const novos=L.filter(x=>ok(x)&&x.etapa==="novo").sort((a,b)=>(ord[a.temp]-ord[b.temp])||((a.tel?0:1)-(b.tel?0:1))).map(x=>[x,"p1"]);
 return [...lemb,...novos].slice(0,LOTE)}
function filaAbrir(){FQ=filaMontar();fi=0;if(!FQ.length)return alert("Ninguém na fila hoje: os lembretes aparecem 3 dias depois da primeira mensagem.");filaMostrar();$("fila").showModal()}
function filaMostrar(){if(fi>=FQ.length){$("fila").close();render();return alert("Envio do dia concluído! "+FQ.length+" mensagens.")}
 const [x,k]=FQ[fi];const m=MSGS.find(m=>m[0]===k);
 $("fq_t").textContent=`Envio do dia · ${fi+1} de ${FQ.length}`;$("fq_nome").textContent=x.nome||("+"+x.tel);
 $("fq_info").textContent=(k==="p1"?"Mensagem 1 · Reconexão":"Mensagem 4 · Lembrete")+" · "+x.temp+(x.tel?"":" · SEM NÚMERO: o texto será copiado");
 $("fq_txt").value=m[3].replaceAll("{n}",primeiroNome(x.nome))}
function filaEnviar(){const [x,k]=FQ[fi];const txt=$("fq_txt").value;const d=new Date(Date.now()+3*864e5).toISOString().slice(0,10);
 x.hist=(x.hist||"")+`${br(hojeISO())}: mensagem ${k.toUpperCase()}\n`;
 if(k==="p1"){x.etapa="abordado";x.data=d;x.prox="Lembrete se não responder"}else{x.data="";x.prox="Sem resposta: parar"}
 save();
 if(x.tel){window.open("https://wa.me/"+(x.tel.length<=11?"55"+x.tel:x.tel)+"?text="+encodeURIComponent(txt),"_blank")}
 else{navigator.clipboard&&navigator.clipboard.writeText(txt);alert("Texto copiado. Abra a conversa de "+(x.nome||"")+" no WhatsApp e cole.")}
 filaProx(false)}
function filaProx(pulou){fi++;filaMostrar()}
function copiarMsg(){navigator.clipboard&&navigator.clipboard.writeText($("f_txt").value)}
function salvar(){const ant=cur.etapa,novo=!L.includes(cur);["nome","tel","temp","etapa","comprou","int","obs","prox","data"].forEach(f=>cur[f]=$("f_"+f).value.trim());
 cur.tel=cur.tel.replace(/\D/g,"");if(cur.tel&&cur.tel.length<=11)cur.tel="55"+cur.tel;cur.ddd=cur.tel?cur.tel.slice(2,4):cur.ddd;
 if(novo)L.push(cur);if(ant!==cur.etapa||novo)cur.hist=(cur.hist||"")+`${br(hojeISO())}: ${ETAPAS.find(e=>e[0]===cur.etapa)[1]}\n`;save();$("dlg").close();render()}
function excluir(){if(confirm("Tirar "+(cur.nome||"este contato")+" do CRM?")){L=L.filter(x=>x!==cur);save();$("dlg").close();render()}}
function hoje(){$("q").value="";$("ft").value="";lista="";const h=hojeISO();const H=L.filter(x=>x.data&&x.data<=h&&!["convertido","perdido"].includes(x.etapa));alert(H.length?"Pra hoje:\n\n"+H.map(x=>"• "+(x.nome||"+"+x.tel)+" — "+(x.prox||"retomar")).join("\n"):"Nada marcado pra hoje.");}
function exportar(){const c=["nome","tel","ddd","lista","temp","etapa","comprou","int","obs","prox","data"];const s="\ufeff"+c.join(";")+"\n"+L.map(x=>c.map(k=>String(x[k]||"").replace(/[;\n]/g," ")).join(";")).join("\n");const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));a.download="crm-vipo-"+hojeISO()+".csv";a.click()}
